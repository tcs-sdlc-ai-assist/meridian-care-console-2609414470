services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite+aiosqlite:////tmp/meridian/app.db
      JWT_SECRET: dev-secret-change-in-production
      SEED_ON_STARTUP: "true"
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
